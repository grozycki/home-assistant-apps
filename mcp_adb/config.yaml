name: "MCP Android Debug Bridge"
description: "Android Debug Bridge (ADB) server for MCP to communicate with Android devices."
version: "1.0.12"
slug: "mcp_adb"
init: false
arch:
  - aarch64
  - amd64
startup: services
ports:
  8555/tcp: 8555
apparmor: true
options:
  device_ip: 127.0.0.1
  port: 5555
schema:
  device_ip: str
  port: int
host_network: true
